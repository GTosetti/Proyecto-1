title: Service Installed From An Unusual Path Or With A Masquerading Name
id: 262b50b4-e863-4825-842d-05ce1fd303dc
name: win_security_4697_service_installed
status: experimental
description: |
  Security Event ID 4697, a service installation, where the service image is outside the
  system binary directories, or the service name imitates a Windows service, or the service
  runs a script interpreter.
  This rule exists because of a measured detection gap, not because 4697 is exotic. In the
  home lab on 2026-08-08 a test service was installed at 21:44:56 local time.
  Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4697} returned the event, the
  Security channel is declared in the Wazuh agent configuration so the event was forwarded,
  and yet a query of the wazuh-alerts-* index returned 0 documents with Event ID 4697: no
  rule in the stock ruleset matches it. The same real-world fact - a service was installed -
  did produce an alert, through Event ID 7045 from the System channel.
  That is a hole in the third layer of coverage. Generation worked, collection worked,
  detection did not, and a gap in that third layer produces no error, no missing-alert
  indicator and nothing to search for. It is invisible from the dashboard; the only way to
  find it is to cause the event deliberately and check whether it arrives.
  Keep the 7045 rule as well. The two events describe the same fact with different fields:
  7045 carries the image path and start type, 4697 additionally carries SubjectUserName and
  SubjectLogonId, which is the account that installed the service - the field that turns
  "a service appeared" into "this session installed it", and the one that joins to the rest
  of the session's activity.
  Condition shape: the first clause catches images outside System32 and SysWOW64; the second
  and third clauses deliberately override the system-path filter, because a masquerading
  name or a service whose image is C:\Windows\System32\cmd.exe is suspicious precisely while
  living in a trusted directory.
references:
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4697
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1036/004/
  - >-
    Lab measurement 2026-08-08: Security 4697 present at 21:44:56 local, forwarded by the agent, 0 matching
    documents in wazuh-alerts-*; the same service installation alerted via System 7045
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.persistence
  - attack.t1543.003
  - attack.privilege-escalation
  - attack.stealth
  - attack.t1036.004
logsource:
  product: windows
  service: security
  definition: >-
    Requires the Security System Extension audit subcategory, which is one of the ten subcategories enabled by
    the lab baseline script. Without it the event is never written, and the gap moves from the detection layer
    to the generation layer.
detection:
  service_installed:
    EventID: 4697
  filter_system_binary_path:
    ServiceFileName|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - '"C:\Windows\System32\'
      - '"C:\Windows\SysWOW64\'
      - '%SystemRoot%\System32\'
  selection_masquerading_name:
    ServiceName|contains:
      - 'svhost'
      - 'scvhost'
      - 'lsass_'
      - 'WinDefender'
  selection_interpreter_as_service:
    ServiceFileName|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd.exe /c'
      - 'cmd.exe /k'
      - 'rundll32'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'regsvr32'
  condition: >-
    service_installed and (not filter_system_binary_path or selection_masquerading_name or
    selection_interpreter_as_service)
fields:
  - ServiceName
  - ServiceFileName
  - ServiceType
  - ServiceStartType
  - ServiceAccount
  - SubjectUserName
  - SubjectLogonId
falsepositives:
  - >-
    Ordinary software installation. Any application that ships a service installs it from C:\Program Files,
    which is outside the filtered paths, so it matches. This is the dominant false positive and it is
    structural: the rule cannot tell an installer from an attacker by path alone, only by whether the
    installation was expected.
  - >-
    Security and monitoring agents. The lab endpoint itself has two services installed this way - Sysmon and
    the Wazuh agent - and any fleet deployment of an agent will light this rule up across every host at once.
    Allowlist by ServiceName and ServiceFileName, not by disabling the rule.
  - >-
    Windows Update and driver installation can register services with unfamiliar names. Correlate
    SubjectUserName with the expected maintenance account before escalating.
  - >-
    Measured coverage note rather than a false positive: in this lab 4697 has been generated once and has
    never produced a stock alert, so there is no observed false positive rate for it here. The
    masquerading-name and interpreter clauses have not been exercised in the lab at all - they are written
    from the technique description, not from a measurement, and are labelled as such.
level: medium
