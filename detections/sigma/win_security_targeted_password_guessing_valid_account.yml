title: Failed Logon With Wrong Password Against An Existing Account
id: 52a180ff-9c4f-4cfa-9859-87ea5d9705e6
name: win_security_4625_substatus_wrong_password
status: experimental
description: |
  Base event for targeted password guessing: a logon failure whose SubStatus is 0xC000006A,
  meaning the account exists and the password was wrong.
  Measured in the home lab on 2026-09-07: of 18 authentication attempts from 10.10.10.5,
  the last 3 (18:31:13-18:31:16) carried SubStatus 0xC000006A against a real local account,
  immediately after 15 attempts with SubStatus 0xC0000064 against names that do not exist.
  The transition between the two SubStatus values is the moment enumeration becomes a
  targeted attack: the attacker has stopped guessing who and started guessing what. The
  fourth attempt succeeded (Security 4624, logon type 3, NTLM, 18:31:19).
  This document does not alert on its own; it feeds the correlation rule below.
references:
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://attack.mitre.org/techniques/T1110/001/
  - >-
    Lab measurement 2026-09-07: 3 x 4625 SubStatus 0xC000006A from 10.10.10.5 at 18:31:13-18:31:16, followed
    by a successful 4624 type 3 at 18:31:19
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: windows
  service: security
  definition: >-
    Requires the Logon audit subcategory (failure). SubStatus is only present in the 4625 event data; it is
    not in the rendered message text, so a rule written against the description string cannot see it.
detection:
  failed_logon_wrong_password:
    EventID: 4625
    SubStatus: '0xC000006A'
  condition: failed_logon_wrong_password
fields:
  - IpAddress
  - TargetUserName
  - LogonType
  - WorkstationName
  - LogonProcessName
  - AuthenticationPackageName
falsepositives:
  - >-
    A user who changed their password on one device while another device keeps retrying the old one (mapped
    drives, mail clients, scheduled tasks). This is the dominant benign cause of 0xC000006A in any real
    environment.
  - An expired service account password after a rotation that missed one host.
level: informational
---
title: Targeted Password Guessing Against A Valid Account
id: bc6a6c3d-cd84-4553-9398-20819ad13cec
status: experimental
description: |
  Repeated wrong-password failures against the same existing account from the same source
  address. Rated higher than the enumeration rule because the attacker already knows the
  account exists; only the password is missing.
  Threshold reasoning from lab data: the local account lockout policy on the endpoint is
  10 attempts / 10 minutes, measured on 2026-09-07. A threshold of 3 inside 10 minutes
  therefore fires while the attacker still has attempts left, instead of turning into an
  after-the-fact lockout notification. The lab's own attack produced exactly 3 such events
  in 3 seconds and then succeeded on the fourth, which is the case this rule is sized for:
  the detection has to arrive before the successful logon, not after it.
  Pair this with a check for a subsequent 4624 from the same IpAddress and TargetUserName -
  in the lab that success came 3 seconds after the last failure.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - >-
    Lab measurement 2026-09-07: local lockout threshold 10 attempts / 10 minutes; 3 x 0xC000006A then a
    successful logon on the fourth attempt
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - win_security_4625_substatus_wrong_password
  group-by:
    - IpAddress
    - TargetUserName
  timespan: 10m
  condition:
    gte: 3
falsepositives:
  - >-
    A stale cached credential on a second device after a password change. This produces exactly the shape this
    rule looks for - same account, same source, repeated - and is the reason the rule must be triaged rather
    than actioned automatically. Check whether the source address is a host the user normally works from and
    whether the attempts stop after a reboot or credential-manager clear.
  - >-
    A service account whose password was rotated in one place only. Identifiable because the interval between
    attempts is machine-regular.
  - >-
    Raise the threshold above 3 in environments where the lockout threshold is lower than 10, otherwise the
    lockout event (4740) arrives first and this rule adds nothing.
  - >-
    Not observed in this lab: the only 0xC000006A events recorded on the endpoint were the 3 generated
    deliberately on 2026-09-07.
level: high
