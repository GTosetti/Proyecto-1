title: Failed Network Logon (Logon Type 3)
id: f4131de0-1216-4215-a9b1-6d42d68f726e
name: win_security_4625_logon_type_3
status: experimental
description: |
  Base event: any failed logon of type 3 (network). On its own this says almost nothing -
  SMB, RDP behind Network Level Authentication, WinRM and file-share access all produce the
  same logon type on failure.
  Measured in the home lab on 2026-09-07: four failed RDP logins at 18:33:28-18:33:29 were
  recorded as 4625 with LogonType 3, not LogonType 10. With NLA enabled, authentication
  happens before the session is created, so a failed RDP logon never reaches the point where
  Windows would call it a RemoteInteractive logon. The only LogonType 10 of the whole
  exercise appeared at 18:35:09, when a full graphical session actually established
  (AuthenticationPackageName Negotiate, LogonProcessName User32).
  Consequence for detection engineering, and the reason this file exists: a rule written as
  "RDP brute force = 4625 LogonType 10" misses every NLA-protected target, and NLA is the
  default. The logon type has to be corroborated from the Terminal Services channel instead.
  This document does not alert on its own.
references:
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1021/001/
  - >-
    Lab measurement 2026-09-07: 4 failed RDP logins at 18:33:28-18:33:29 recorded as 4625 LogonType 3; the
    single LogonType 10 of the exercise appeared only at 18:35:09 on a successful graphical session
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: windows
  service: security
  definition: 'Requires the Logon audit subcategory (failure).'
detection:
  failed_network_logon:
    EventID: 4625
    LogonType: 3
  condition: failed_network_logon
fields:
  - IpAddress
  - TargetUserName
  - SubStatus
  - WorkstationName
  - LogonProcessName
  - AuthenticationPackageName
falsepositives:
  - >-
    Expected in normal operation on any host that serves SMB. Type 3 failures are background noise and this
    document is not meant to be alerted on directly.
level: informational
