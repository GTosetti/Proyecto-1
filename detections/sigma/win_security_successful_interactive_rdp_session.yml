title: Successful RemoteInteractive Logon (Logon Type 10)
id: 8bb07c4a-2f88-4bb0-8dfb-70874f80842d
name: win_security_4624_logon_type_10
status: experimental
description: |
  Base event: a successful logon of type 10, RemoteInteractive. With Network Level
  Authentication enabled this type appears only when a graphical session is actually
  established, never on a failure.
  Measured in the home lab on 2026-09-07: the only LogonType 10 of the entire attack
  exercise was recorded at 18:35:09, when an xfreerdp session under xvfb finally established
  a desktop - AuthenticationPackageName Negotiate, LogonProcessName User32. Earlier
  authentications with xfreerdp in auth-only mode (18:33:30-18:33:31) produced 4624 events
  with LogonType 3 instead, and the four failed attempts produced 4625 with LogonType 3. A
  session held open for less than roughly 60 seconds was cut before the logon completed and
  left only the Terminal Services connection events behind.
  This document does not alert on its own; it feeds the correlation below.
references:
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624
  - https://attack.mitre.org/techniques/T1021/001/
  - https://attack.mitre.org/techniques/T1078/003/
  - >-
    Lab measurement 2026-09-07: 4624 LogonType 10 at 18:35:09, Negotiate / User32, after a full graphical RDP
    session established from 10.10.10.5
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.lateral-movement
  - attack.t1021.001
  - attack.stealth
  - attack.t1078.003
logsource:
  product: windows
  service: security
  definition: 'Requires the Logon audit subcategory (success).'
detection:
  remote_interactive_logon:
    EventID: 4624
    LogonType: 10
  condition: remote_interactive_logon
fields:
  - IpAddress
  - TargetUserName
  - TargetLogonId
  - LogonProcessName
  - AuthenticationPackageName
falsepositives:
  - Every legitimate remote desktop login. On its own this is an inventory event, not a detection.
level: informational
