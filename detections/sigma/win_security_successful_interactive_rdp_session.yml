title: Terminal Services Session Logon Or Reconnection
id: 585b0663-197b-4d27-ba17-72556133d2ba
name: win_terminalservices_lsm_session_logon
status: experimental
description: |
  Base event: the Terminal Services Local Session Manager recorded a session logon
  (Event ID 21) or a session reconnection (Event ID 22), both of which carry the source
  network address of the client.
  Measured in the home lab on 2026-09-07: the graphical RDP session that established at
  18:35:09 produced the sequence 41 -> 42 -> 21 -> 22 -> 24 in this channel, alongside
  Event ID 1149 in the RemoteConnectionManager channel carrying Source Network Address
  10.10.10.5.
  Correlating with this channel matters because it is what survives when the Security log is
  cleared: it is a different channel with a different retention, and an attacker who clears
  Security (Event ID 1102) does not necessarily clear this one.
references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/remote-desktop-services-events
  - https://attack.mitre.org/techniques/T1021/001/
  - >-
    Lab measurement 2026-09-07: TerminalServices-LocalSessionManager sequence 41 -> 42 -> 21 -> 22 -> 24 at
    the 18:35:09 session
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  product: windows
  service: terminalservices-localsessionmanager
  definition: >-
    Requires the Microsoft-Windows-TerminalServices-LocalSessionManager/Operational channel to be collected.
    It is not one of the five channels the lab agent forwards by default, so it must be added to ossec.conf
    before this rule can fire.
detection:
  session_logon_or_reconnect:
    EventID:
      - 21
      - 22
  condition: session_logon_or_reconnect
fields:
  - User
  - SessionID
  - Address
falsepositives:
  - Every legitimate remote desktop session. Corroboration only.
level: informational
