title: Terminal Services Session Logon Or Shell Start
id: 585b0663-197b-4d27-ba17-72556133d2ba
name: win_terminalservices_lsm_session_logon
status: experimental
description: |
  Base event: the Terminal Services Local Session Manager recorded a session logon
  (Event ID 21) or a shell start (Event ID 22), both of which carry the source network
  address of the client.
  The event IDs in this channel are 21 logon, 22 shell start notification received, 23
  logoff, 24 disconnect and 25 reconnection. 22 is not a reconnection: it follows a fresh
  21 when the desktop shell comes up, which is exactly what the lab sequence below shows.
  Reconnection to an existing session is 25, and it is deliberately not selected here
  because this lab has never produced one.
  Measured in the home lab on 2026-09-07: the graphical RDP session that established at
  18:35:09 produced 41 -> 42 -> 21 -> 22 in this channel, then a 24 when the session was
  disconnected at 18:36:49; alongside Event ID 1149 in the RemoteConnectionManager channel
  carrying Source Network Address 10.10.10.5. The 22 arrived immediately after the 21 on a
  brand-new session, which is the measurement that settles what 22 means.
  Correlating with this channel matters because it is what survives when the Security log is
  cleared: it is a different channel with a different retention, and an attacker who clears
  Security (Event ID 1102) does not necessarily clear this one.
references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/remote-desktop-services-events
  - https://attack.mitre.org/techniques/T1021/001/
  - >-
    Lab measurement 2026-09-07: TerminalServices-LocalSessionManager 41 -> 42 -> 21 -> 22 at the 18:35:09
    session, then 24 at the 18:36:49 disconnect
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  product: windows
  service: terminalservices-localsessionmanager
  definition: >-
    Requires the Microsoft-Windows-TerminalServices-LocalSessionManager/Operational channel to be collected.
    It is not one of the five channels the lab agent forwards by default, so it must be added to ossec.conf
    before this rule can fire.
detection:
  session_logon_or_shell_start:
    EventID:
      - 21
      - 22
  condition: session_logon_or_shell_start
fields:
  - User
  - SessionID
  - Address
falsepositives:
  - Every legitimate remote desktop session. Corroboration only.
level: informational
