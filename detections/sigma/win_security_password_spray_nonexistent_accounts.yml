title: Failed Logon Against Non-Existent Accounts (Enumeration Primitive)
id: 93e90c0b-2946-4a0e-88e5-47ed2c836162
name: win_security_4625_substatus_no_such_user
status: experimental
description: |
  Base event for user enumeration and password spraying: a Windows logon failure whose
  SubStatus is 0xC0000064, meaning the account name itself does not exist.
  Measured in the home lab on 2026-09-07: 15 of 18 authentication attempts coming from
  10.10.10.5 (the attacker VM) carried Status 0xC000006D with SubStatus 0xC0000064 against
  five account names that do not exist on the endpoint (admin, administrador, backup,
  sqlsvc, helpdesk), between 18:30:10 and 18:30:43. The endpoint's local lockout policy
  (10 attempts / 10 minutes) never applied to any of them, because a lockout counter only
  exists for an account that exists. WorkstationName was empty ('-') on all 15 events,
  which is what non-Windows tooling produces.
  This document does not raise an alert on its own; it is the input to the two correlation
  rules below. A single 0xC0000064 is a typo, not an attack.
references:
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1087/001/
  - >-
    Lab measurement 2026-09-07: 18 authentication attempts from 10.10.10.5 against WIN11-VICTIMA, investigated
    from the Wazuh index (see investigations/ in this repository)
  - >-
    Lab measurement 2026-08-08: 10 x 4625 split into 5 logon type 2 (runas, ::1) and 5 logon type 3
    (smbclient, 10.10.10.5), all with SubStatus 0xC0000064
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.discovery
  - attack.t1087.001
logsource:
  product: windows
  service: security
  definition: >-
    Requires the Logon audit subcategory (failure). Enabled on the lab endpoint with auditpol; the Security
    channel was raised to 256 MB because the 20 MB default rolls over during an attack.
detection:
  failed_logon_unknown_user:
    EventID: 4625
    SubStatus: '0xC0000064'
  condition: failed_logon_unknown_user
fields:
  - IpAddress
  - TargetUserName
  - LogonType
  - WorkstationName
  - LogonProcessName
  - AuthenticationPackageName
falsepositives:
  - >-
    A user whose account was renamed or deleted while a device kept a scheduled task, mapped drive or mail
    client retrying the old name. Distinguishable because the old name repeats and no other names appear from
    the same source.
  - Vulnerability scanners and asset-inventory tools configured with a canned account list.
  - >-
    Typing a username that does not exist. Single events are expected noise, which is why the alerting rules
    below require several distinct names.
level: informational
---
title: Password Spraying Against Multiple Non-Existent Accounts From One Source
id: a9c364fb-0dfd-409c-9ca7-4ca4210b09c2
status: experimental
description: |
  Several distinct non-existent account names failed authentication from the same source
  address inside a short window. This is the enumeration phase of a spray: the attacker is
  still looking for a valid account name, and lockout policy does not apply.
  Motivation, measured in the lab on 2026-09-07: Wazuh's stock correlation rule 60204
  ('Multiple Windows Logon Failures', level 10) fired twice on this activity by accumulating
  rule 60122 events, but it does not read SubStatus, so it cannot separate 15 failures
  against 5 names that do not exist from one user who forgot a password. The distinction
  matters because it is the difference between "someone is mapping our account names" and
  "someone mistyped".
  Threshold reasoning from lab data: the 2026-09-07 exercise produced 5 distinct
  non-existent names from 10.10.10.5 in 33 seconds, so a threshold of 3 fires on it. The
  2026-08-08 exercise produced 10 failures with the same SubStatus but only one account name
  per source ('usuario-fantasma' from ::1 via runas, 'fantasma' from 10.10.10.5 via
  smbclient), so this rule stays silent on it. That silence is the intended behaviour and is
  what separates this rule from a plain failure counter.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - >-
    https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
  - >-
    Lab measurement 2026-09-07: 15 x 4625 SubStatus 0xC0000064 from 10.10.10.5 against 5 distinct names,
    18:30:10-18:30:43
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.003
  - attack.discovery
  - attack.t1087.001
correlation:
  type: value_count
  rules:
    - win_security_4625_substatus_no_such_user
  group-by:
    - IpAddress
  timespan: 15m
  condition:
    field: TargetUserName
    gte: 3
falsepositives:
  - >-
    A decommissioned application server still holding credentials for several removed service accounts.
    Identifiable because the same set of names repeats on a fixed schedule from a fixed host.
  - >-
    An authenticated vulnerability scan using a list of default account names. Should be allowlisted by
    scanner source address, not by lowering the threshold.
  - >-
    A shared kiosk or lab machine where several people mistype usernames within the same window. Rare, and the
    source address is a workstation that normally authenticates successfully.
  - >-
    Not observed in this lab: every 0xC0000064 event recorded on the endpoint (10 on 2026-08-08, 15 on
    2026-09-07) was deliberately generated. No benign source produced this SubStatus during the measured
    windows.
level: medium
---
title: Slow Password Spraying Against Non-Existent Accounts (Long Window)
id: df5a5d89-1d55-4311-b5ae-c3c955a4dd11
status: experimental
description: |
  Same signal as the 15-minute rule, evaluated over 24 hours, for an attacker who paces the
  attempts to stay under short-window correlation.
  This variant exists because of a measurement, not a hunch. Get-SmbServerConfiguration on
  the lab endpoint (Windows 11 Pro 25H2) returned EnableAuthRateLimiter = True and
  InvalidAuthenticationDelayTimeInMs = 2000, and the 15 failures of 2026-09-07 arrived
  spaced about 2 seconds apart as a result. That 2-second spacing is the mitigation working,
  not the attacker's tooling, and it is also the proof that the attacker's rate is already
  being shaped by the defender. An attacker who accepts one attempt per hour produces the
  same enumeration with no burst at all, and every short-window rule misses it.
  Run this alongside the 15-minute rule, not instead of it: they answer different questions.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/powershell/module/smbshare/get-smbserverconfiguration
  - >-
    Lab measurement 2026-09-07: EnableAuthRateLimiter = True, InvalidAuthenticationDelayTimeInMs = 2000 on
    WIN11-VICTIMA; failures observed about 2 s apart
author: Proyecto-1 home SOC lab
date: 2026-09-15
modified: 2026-09-15
tags:
  - attack.credential-access
  - attack.t1110.003
  - attack.discovery
  - attack.t1087.001
correlation:
  type: value_count
  rules:
    - win_security_4625_substatus_no_such_user
  group-by:
    - IpAddress
  timespan: 24h
  condition:
    field: TargetUserName
    gte: 5
falsepositives:
  - >-
    Over 24 hours, a retrying service account, a scanner and ordinary typos can accumulate on the same source
    without any attack. The threshold is deliberately higher than the short-window rule for this reason.
  - >-
    Source addresses that are NAT gateways or VPN concentrators aggregate many users behind one IP and will
    accumulate distinct names. Exclude those addresses or group by WorkstationName where it is populated -
    note that in the lab WorkstationName was empty on all attacker events, so it cannot be relied on as the
    only grouping key.
level: medium
