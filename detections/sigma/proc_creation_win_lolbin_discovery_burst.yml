title: Discovery Command Executed From a Built-in Utility
id: 2c48b6f9-5a13-4e7d-b0f4-7d9128e3c561
name: lolbin_discovery_command_single
status: experimental
description: |
    Base rule for the discovery-burst correlation below. On its own a single one of these
    commands is not an alert, and this repository has the measurement to say so: on 2026-08-11
    whoami.exe produced a Security 4688 matched by catch-all Wazuh rule 67027 at level 3 -
    byte for byte the same treatment as sppsvc.exe, a routine system process - and no Sysmon
    rule fired on it either. Security 4798/4799 (enumeration of a user's local group membership)
    generated 2 events and 0 alerts in the same window, confirmed against a widened time range.
    This rule therefore carries level informational and exists to be counted, not to be triaged.
references:
    - https://attack.mitre.org/techniques/T1033/
    - https://attack.mitre.org/techniques/T1087/001/
    - https://attack.mitre.org/techniques/T1016/
    - https://attack.mitre.org/techniques/T1082/
    - >-
      Internal lab measurement, 2026-08-11 B4 exercise (whoami.exe alerted only through catch-all rule 67027
      at level 3; 4798/4799 alerted 0 of 2)
author: Proyecto-1 home SOC lab
date: 2026-09-15
tags:
    - attack.discovery
    - attack.t1033
    - attack.t1087.001
    - attack.t1016
    - attack.t1082
logsource:
    category: process_creation
    product: windows
detection:
    selection_whoami:
        Image|endswith: '\whoami.exe'
    selection_net:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - ' user'
            - ' localgroup'
            - ' group'
            - ' view'
            - ' share'
            - ' accounts'
    selection_other:
        Image|endswith:
            - '\nltest.exe'
            - '\systeminfo.exe'
            - '\ipconfig.exe'
            - '\arp.exe'
            - '\quser.exe'
            - '\tasklist.exe'
            - '\hostname.exe'
            - '\route.exe'
            - '\netstat.exe'
    condition: 1 of selection_*
falsepositives:
    - Every one of these binaries is used routinely by administrators and by logon scripts. That
      is the point of the base rule being informational; only the correlation is meant to reach a
      queue.
level: informational
